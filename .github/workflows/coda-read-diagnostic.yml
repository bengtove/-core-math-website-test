name: Coda read-only diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-coda:
    name: Inspect funding database structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
      CODA_TARGET_DOCUMENT: Mathematics funding database
      CODA_TARGET_BROWSER_URL: https://docs.superhuman.com/d/_dtwgdrEvtAq/

    steps:
      - name: Discover document and list its tables using read-only endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE_URL = "https://coda.io/apis/v1"
          token = os.environ.get("CODA_API_TOKEN", "")
          target_name = os.environ["CODA_TARGET_DOCUMENT"]
          target_browser_url = os.environ["CODA_TARGET_BROWSER_URL"]

          if not token:
              print(
                  "ERROR: The required repository secret is not available to this workflow.",
                  file=sys.stderr,
              )
              sys.exit(1)

          def get_json(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = f"{BASE_URL}{path}"
              if query:
                  url = f"{url}?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(
                      f"ERROR: Coda API returned HTTP {error.code} for {path}.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              except urllib.error.URLError as error:
                  print(
                      f"ERROR: Could not reach Coda API for {path}: {error.reason}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          def list_all(path, params=None):
              items = []
              page_params = dict(params or {})
              while True:
                  response = get_json(path, page_params)
                  items.extend(response.get("items", []))
                  next_token = response.get("nextPageToken")
                  if not next_token:
                      return items
                  page_params["pageToken"] = next_token

          print("=== Documents visible to the token ===")
          documents = list_all("/docs", {"limit": 100})

          if not documents:
              print("No documents were returned by the list-docs API.")

          for document in documents:
              print(f"- Name: {document.get('name', '<unnamed>')}")
              print(f"  API document ID: {document.get('id', '<missing>')}")
              print(
                  "  browserLink: "
                  + str(document.get("browserLink") or "<not returned>")
              )

          normalized_target_name = target_name.strip().casefold()
          normalized_target_url = target_browser_url.rstrip("/").casefold()

          name_matches = [
              document
              for document in documents
              if normalized_target_name
              in str(document.get("name", "")).strip().casefold()
          ]
          url_matches = [
              document
              for document in documents
              if normalized_target_url
              in str(document.get("browserLink", "")).rstrip("/").casefold()
          ]

          if len(url_matches) == 1:
              target = url_matches[0]
          elif len(url_matches) > 1:
              print(
                  "ERROR: More than one document matched the target browser URL; "
                  "stopping without guessing an API document ID.",
                  file=sys.stderr,
              )
              sys.exit(1)
          elif len(name_matches) == 1:
              target = name_matches[0]
          elif len(name_matches) > 1:
              print(
                  "ERROR: More than one document matched the target name; "
                  "stopping without guessing an API document ID.",
                  file=sys.stderr,
              )
              sys.exit(1)
          else:
              print(
                  "ERROR: The restricted token cannot see the Mathematics funding "
                  "database document through the list-docs API. No document ID was "
                  "inferred or guessed.",
                  file=sys.stderr,
              )
              sys.exit(1)

          document_id = target.get("id")
          if not document_id:
              print(
                  "ERROR: The matching document did not include an API document ID; "
                  "stopping without guessing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("\n=== Selected document ===")
          print(f"Name: {target.get('name', '<unnamed>')}")
          print(f"API document ID: {document_id}")
          print(f"browserLink: {target.get('browserLink') or '<not returned>'}")

          encoded_document_id = urllib.parse.quote(str(document_id), safe="")

          print("\n=== Tables and views ===")
          tables = list_all(
              f"/docs/{encoded_document_id}/tables",
              {"limit": 100},
          )

          if not tables:
              print("No tables or views were returned.")
              sys.exit(0)

          for item in tables:
              kind = item.get("tableType") or item.get("type") or "unknown"
              print(
                  f"- {item.get('name', '<unnamed>')} | "
                  f"immutable ID: {item.get('id', '<missing>')} | "
                  f"type: {kind}"
              )
          PY
