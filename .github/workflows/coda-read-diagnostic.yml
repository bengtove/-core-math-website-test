name: Coda read-only diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-coda:
    name: Inspect funding database structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
      CODA_EXPECTED_DOCUMENT_ID: twgdrEvtAq
      CODA_TARGET_DOCUMENT: Mathematics funding database
      CODA_TARGET_BROWSER_URL: https://docs.superhuman.com/d/_dtwgdrEvtAq/Mathematics-funding-database_su79Sp_C
      CODA_TARGET_TABLE: Mathematics funding database
      CODA_PERMISSION_TEST_DOCUMENT_ID: D4Qz3eJngD

    steps:
      - name: Discover document and inspect funding table using read-only endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE_URL = "https://coda.io/apis/v1"
          token = os.environ.get("CODA_API_TOKEN", "")
          expected_document_id = os.environ["CODA_EXPECTED_DOCUMENT_ID"]
          target_document_name = os.environ["CODA_TARGET_DOCUMENT"]
          target_browser_url = os.environ["CODA_TARGET_BROWSER_URL"]
          target_table_name = os.environ["CODA_TARGET_TABLE"]

          if not token:
              print(
                  "ERROR: The required repository secret is not available to this workflow.",
                  file=sys.stderr,
              )
              sys.exit(1)

          def get_json(path, params=None):
              query = urllib.parse.urlencode(params or {})
              url = f"{BASE_URL}{path}"
              if query:
                  url = f"{url}?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(
                      f"ERROR: Coda API returned HTTP {error.code} for {path}.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
              except urllib.error.URLError as error:
                  print(
                      f"ERROR: Could not reach Coda API for {path}: {error.reason}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          def list_all(path, params=None):
              items = []
              page_params = dict(params or {})
              while True:
                  response = get_json(path, page_params)
                  items.extend(response.get("items", []))
                  next_token = response.get("nextPageToken")
                  if not next_token:
                      return items
                  page_params["pageToken"] = next_token

          print("=== Documents visible to the token ===")
          documents = list_all("/docs", {"limit": 100})

          if not documents:
              print("No documents were returned by the list-documents API.")

          for document in documents:
              print(f"- Document name: {document.get('name', '<unnamed>')}")
              print(f"  API document ID: {document.get('id', '<missing>')}")
              print(
                  "  browserLink: "
                  + str(document.get("browserLink") or "<not returned>")
              )

          normalized_expected_id = expected_document_id.strip().casefold()
          normalized_target_name = target_document_name.strip().casefold()
          normalized_target_url = target_browser_url.rstrip("/").casefold()
          normalized_browser_root = (
              "https://docs.superhuman.com/d/_dtwgdrEvtAq".casefold()
          )

          id_matches = [
              document
              for document in documents
              if str(document.get("id", "")).strip().casefold()
              == normalized_expected_id
          ]
          url_matches = [
              document
              for document in documents
              if normalized_browser_root
              in str(document.get("browserLink", "")).rstrip("/").casefold()
              or normalized_target_url
              in str(document.get("browserLink", "")).rstrip("/").casefold()
          ]
          name_matches = [
              document
              for document in documents
              if normalized_target_name
              in str(document.get("name", "")).strip().casefold()
          ]

          if len(id_matches) == 1:
              target_document = id_matches[0]
          elif len(id_matches) > 1:
              print(
                  "ERROR: More than one listed document returned the expected API "
                  "document ID; stopping.",
                  file=sys.stderr,
              )
              sys.exit(1)
          elif len(url_matches) == 1:
              target_document = url_matches[0]
          elif len(url_matches) > 1:
              print(
                  "ERROR: More than one document matched the supplied browser URL; "
                  "stopping without guessing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          elif len(name_matches) == 1:
              target_document = name_matches[0]
          elif len(name_matches) > 1:
              print(
                  "ERROR: More than one document matched the target name; "
                  "stopping without guessing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          else:
              print(
                  f"ERROR: API document ID {expected_document_id!r} was not present "
                  "in the list-documents response, and no unique browser-link or "
                  "name match was found.",
                  file=sys.stderr,
              )
              sys.exit(1)

          document_id = target_document.get("id")
          if not document_id:
              print(
                  "ERROR: The matching document did not include an API document ID; "
                  "stopping without guessing.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("\n=== Selected document ===")
          print(f"Document name: {target_document.get('name', '<unnamed>')}")
          print(f"API document ID: {document_id}")
          print(
              "browserLink: "
              + str(target_document.get("browserLink") or "<not returned>")
          )

          encoded_document_id = urllib.parse.quote(str(document_id), safe="")

          print("\n=== Tables and views ===")
          tables = list_all(
              f"/docs/{encoded_document_id}/tables",
              {"limit": 100},
          )
          if not tables:
              print("No tables or views were returned.")
              sys.exit(1)

          for item in tables:
              kind = item.get("tableType") or item.get("type") or "unknown"
              print(
                  f"- {item.get('name', '<unnamed>')} | "
                  f"immutable ID: {item.get('id', '<missing>')} | "
                  f"type: {kind}"
              )

          normalized_table_name = target_table_name.strip().casefold()
          table_matches = [
              item
              for item in tables
              if str(item.get("name", "")).strip().casefold()
              == normalized_table_name
          ]
          if len(table_matches) != 1:
              print(
                  f"ERROR: Expected one exact table/view match for "
                  f"{target_table_name!r}; found {len(table_matches)}.",
                  file=sys.stderr,
              )
              sys.exit(1)

          target_table = table_matches[0]
          table_id = target_table["id"]
          table_kind = (
              target_table.get("tableType")
              or target_table.get("type")
              or "unknown"
          )
          encoded_table_id = urllib.parse.quote(str(table_id), safe="")

          print("\n=== Selected table/view ===")
          print(f"Name: {target_table.get('name')}")
          print(f"Immutable ID: {table_id}")
          print(f"Type: {table_kind}")

          print("\n=== Columns ===")
          columns = list_all(
              f"/docs/{encoded_document_id}/tables/{encoded_table_id}/columns",
              {"limit": 100},
          )
          for column in columns:
              print(
                  f"- {column.get('name', '<unnamed>')} | "
                  f"immutable ID: {column.get('id', '<missing>')}"
              )

          relevant_fields = [
              "Programme",
              "Funder",
              "Description",
              "Status",
              "Deadline",
              "Deadline note",
              "Support type",
              "Career stage",
              "Region",
          ]

          print("\n=== Sample rows (maximum 3; selected fields only) ===")
          rows_response = get_json(
              f"/docs/{encoded_document_id}/tables/{encoded_table_id}/rows",
              {
                  "limit": 3,
                  "sortBy": "natural",
                  "useColumnNames": "true",
                  "valueFormat": "simple",
              },
          )
          rows = rows_response.get("items", [])
          if not rows:
              print("No rows were returned.")
          for index, row in enumerate(rows, start=1):
              values = row.get("values", {})
              selected = {
                  field: values.get(field, "<missing>")
                  for field in relevant_fields
              }
              print(
                  f"Row {index}: "
                  + json.dumps(selected, ensure_ascii=False, default=str)
              )

          print("\n=== Calculated Status check ===")
          status_column = next(
              (
                  column
                  for column in columns
                  if str(column.get("name", "")).strip().casefold() == "status"
              ),
              None,
          )
          if status_column is None:
              print("Status column metadata was not found.")
              sys.exit(1)

          is_calculated = status_column.get("calculated")
          returned_statuses = [
              row.get("values", {}).get("Status")
              for row in rows
              if "Status" in row.get("values", {})
          ]

          print(f"Status immutable column ID: {status_column.get('id')}")
          print(f"Status metadata calculated: {is_calculated!r}")
          print(
              "Status values returned in sample: "
              + json.dumps(returned_statuses, ensure_ascii=False, default=str)
          )

          if is_calculated is True and returned_statuses:
              print(
                  "CONFIRMED: Status is marked calculated and the API returned "
                  "its computed/displayed value in simple format."
              )
          elif is_calculated is True:
              print(
                  "UNCONFIRMED: Status is marked calculated, but no sample row "
                  "returned a Status value."
              )
          else:
              print(
                  "NOT CONFIRMED: The Status column was not marked calculated "
                  "in the returned column metadata."
              )
          PY

      - name: Test unrelated-document content permission
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("CODA_API_TOKEN", "")
          document_id = os.environ["CODA_PERMISSION_TEST_DOCUMENT_ID"]

          if not token:
              print(
                  "ERROR: The required repository secret is not available to this workflow.",
                  file=sys.stderr,
              )
              sys.exit(1)

          encoded_document_id = urllib.parse.quote(document_id, safe="")
          request = urllib.request.Request(
              f"https://coda.io/apis/v1/docs/{encoded_document_id}/tables",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(request, timeout=30):
                  pass
          except urllib.error.HTTPError as error:
              if error.code in (401, 403, 404):
                  print(
                      "PERMISSION TEST PASSED: the restricted token cannot read "
                      "content from the unrelated document."
                  )
                  sys.exit(0)
              print(
                  "PERMISSION TEST INCONCLUSIVE: the unrelated-document request "
                  f"returned HTTP {error.code}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          except urllib.error.URLError:
              print(
                  "PERMISSION TEST INCONCLUSIVE: the Coda API could not be reached.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(
              "PERMISSION TEST FAILED: the restricted token can read content "
              "from the unrelated document."
          )
          sys.exit(1)
          PY
