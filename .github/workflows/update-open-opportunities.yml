name: Update open opportunities data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-open-opportunities
  cancel-in-progress: false

jobs:
  update-data:
    name: Retrieve and commit open opportunities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and validate data in a temporary file
        env:
          CODA_API_TOKEN: ${{ secrets.CODA_API_TOKEN }}
        run: |
          python3 scripts/build_open_opportunities.py "$RUNNER_TEMP/open_opportunities.json"
          python3 -m json.tool "$RUNNER_TEMP/open_opportunities.json" >/dev/null

      - name: Replace generated data after successful validation
        run: |
          install -m 0644 "$RUNNER_TEMP/open_opportunities.json" _data/open_opportunities.json

      - name: Commit generated data when changed
        run: |
          if git diff --quiet -- _data/open_opportunities.json; then
            echo "Open opportunities data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/open_opportunities.json
          git commit -m "Update open opportunities data"
          git push origin HEAD:main
