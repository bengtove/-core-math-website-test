title: CoRE-Math
description: Africa–Europe collaboration in the mathematical sciences

# GitHub Pages has been supplying Primer's base stylesheet implicitly. Pin the
# theme explicitly so that the generated /assets/css/style.css dependency is
# reproducible and remains available to the custom site styles.
theme: jekyll-theme-primer

# GitHub Pages supports this plugin. It generates a canonical sitemap from the
# configured site URL, base URL, pages, posts and output collections.
plugins:
  - jekyll-sitemap

baseurl: "/-core-math-website-test"
url: "https://bengtove.github.io"

permalink: /news/:year/:title/

collections:
  programmes:
    output: true
    permalink: /programmes/:name/
  projects:
    output: true
    permalink: /projects/:name/
  research_groups:
    output: true
    permalink: /research-groups/:name/
  events:
    output: true
    permalink: /events/:name/
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "events"
    values:
      layout: event
  - scope:
      path: ""
    values:
      layout: default
