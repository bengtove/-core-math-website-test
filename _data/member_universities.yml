- name: Addis Ababa University
  country: Ethiopia
  image: https://upload.wikimedia.org/wikipedia/commons/1/1b/ET_Addis_asv2018-01_img13_University_gate.jpg
  image_alt: Addis Ababa University
  url: https://www.aau.edu.et/
  introduction: Addis Ababa University has received long-term ISP support for mathematics since 2005. It contributes to research groups, international schools and mathematics competitions within CoRE-Math.
  portrait: Addis Ababa University has received long-term support for mathematics through the International Science Programme (ISP) since 2005. This collaboration has contributed to the development of postgraduate education, particularly PhD training, and international research connections. Within CoRE-Math, Addis Ababa University participates in research collaboration, research groups and international schools, including the 2026 school in arithmetic geometry. The university has also contributed to the development of mathematics competitions in Ethiopia, including a national competition established in 2022.
- name: Linköping University
  country: Sweden
  image: https://upload.wikimedia.org/wikipedia/commons/0/0e/Campus_valla_link%C3%B6ping_above.jpg
  image_alt: Linköping University
  url: https://liu.se/en/
  introduction: Linköping University has played a major role in Sida-supported mathematics collaboration in Rwanda, Uganda and Tanzania. Its long-term partnerships have supported postgraduate education, research and institutional development.
  portrait: Linköping University has a long history of collaboration with the International Science Programme (ISP) and has played a major role in Sida-supported mathematics collaboration with universities in Rwanda, Uganda and Tanzania. Beginning in Rwanda in 2007, these partnerships have supported postgraduate education, doctoral training, research and institutional development. Linköping has also contributed to the joint development of PhD programmes and curricula across the participating universities. These long-term collaborations form an important part of CoRE-Math's foundations.
- name: LUT University
  country: Finland
  image: https://images.cdn.yle.fi/image/upload/c_crop%2Ch_3502%2Cw_6227%2Cx_0%2Cy_239/ar_1.7777777777777777%2Cc_fill%2Cg_faces%2Ch_431%2Cw_767/dpr_2.0/q_auto%3Aeco/f_auto/fl_lossy/v1646301808/39-92313562209161eed5a
  image_alt: LUT University
  url: https://www.lut.fi/en
  introduction: A longstanding partner in applied mathematics and mathematical modelling in East Africa. Its collaboration has contributed to Modelling Weeks, industrial mathematics and postgraduate education.
  portrait: LUT University's collaboration with East African universities began in 2007 through East Africa Technomathematics, initially involving the University of Dar es Salaam. The collaboration subsequently expanded to other countries and introduced activities such as Modelling Weeks, curriculum development and industrial mathematics. More recent initiatives include WOLIMODS, collaboration with the University of Rwanda in Earth observation, and the Finnish FAME flagship. LUT contributes particularly to applied mathematics, mathematical modelling and connections between mathematics and industry.
- name: Makerere University
  country: Uganda
  image: /assets/images/members/makerere-university-campus.webp
  image_alt: Makerere University campus
  url: https://mak.ac.ug/
  introduction: African co-lead of CoRE-Math and a founding member of EAUMP. Makerere has played a central role in regional mathematics collaboration, postgraduate education and research networks for more than three decades.
  portrait: Makerere University is an African co-lead of CoRE-Math and has played a central role in developing regional mathematics collaboration in East Africa. It was a founding member of the Eastern Africa Universities Mathematics Programme (EAUMP) in 2002, and its mathematics collaboration with the University of Bergen dates back to the early 1990s. Makerere has also participated in Sida-supported research cooperation with Swedish universities, international research groups and regional schools. It leads the East African Network for Women in Basic Sciences (EANWoBAS). Current activities include Math4SDG, postgraduate mobility with Bergen and Groningen, and industrial mathematics.
- name: Stellenbosch University
  country: South Africa
  image: https://blogs.sun.ac.za/sdasm/files/2021/12/Banner3-5-1024x717.jpg
  image_alt: Stellenbosch University
  url: https://www.su.ac.za/en
  introduction: Stellenbosch University joined CoRE-Math in 2026, broadening the Cluster's research base. Its participation strengthens connections with South African mathematical research environments.
  portrait: Stellenbosch University is one of Africa's leading research universities and joined CoRE-Math in 2026, broadening the Cluster's research base and strengthening its connections with South Africa. Its participation provides opportunities to develop research collaboration with other African and European universities and to connect established research environments with the wider CoRE-Math network.
- name: Stockholm University
  country: Sweden
  image: https://www.su.se/images/18.361ef66219a7bb0f4421332c/1764258858403/0-image.jpg
  image_alt: Stockholm University
  url: https://www.su.se/english/
  introduction: Stockholm University has worked with ISP and Sida-supported mathematics programmes in Rwanda, Uganda and Tanzania. These partnerships support continued research and educational collaboration through CoRE-Math.
  portrait: Stockholm University has collaborated with ISP since 2003 and has participated in Sida-supported mathematics programmes with universities in Rwanda, Uganda and Tanzania. These collaborations have supported doctoral education, research and institutional development. Stockholm has also contributed to the development of mathematics competitions and outreach activities in East Africa. Its longstanding partnerships provide an important foundation for continued research and educational collaboration through CoRE-Math.
- name: University of Amsterdam
  country: Netherlands
  image: https://www.uva.nl/binaries/_ht_1717663662062/700x0-jpg/content/gallery/subsites/amsterdam-school-of-economics/2018-redesign/herobanners/rec-e-plein-hoofdingang.jpg
  image_alt: University of Amsterdam
  url: https://www.uva.nl/en
  introduction: Contributes to research collaboration, international workshops and schools, and participates in the management of CoRE-Math. Researchers at the Korteweg-de Vries Institute are active in these collaborations.
  portrait: The University of Amsterdam contributes to CoRE-Math through research collaboration, international research workshops and postgraduate education. Researchers at the Korteweg-de Vries Institute have been involved in mathematical collaborations with African universities, including workshops in algebraic geometry and international schools. Amsterdam also participates in the management and development of CoRE-Math.
- name: University of Bergen
  country: Norway
  image: /assets/images/members/university-of-bergen.jpg
  image_alt: Bergen
  url: https://www4.uib.no/en
  introduction: The University of Bergen's mathematics collaboration with Makerere dates to the early 1990s. It now contributes to Math4SDG, postgraduate mobility and research collaboration across the network.
  portrait: The University of Bergen's mathematics collaboration with Makerere University dates back to the early 1990s, when NUFU-supported programmes contributed to postgraduate education, research and institutional development. This longstanding relationship provided a foundation for Math4SDG, which also involves the University of Dar es Salaam. Current activities include doctoral education, research collaboration, postgraduate mobility through Erasmus+ and NORSTIP, and the Health Data Synergy initiative connecting mathematics and medicine.
- name: University of Dar es Salaam
  country: Tanzania
  image: https://www.thecitizen.co.tz/resource/image/5219890/landscape_ratio3x2/1620/1080/fb700ea2e3b74e59f544126af1dbb1a2/uL/udsm-pic.jpg
  image_alt: University of Dar es Salaam
  url: https://udsm.ac.tz/
  introduction: A founding member of EAUMP with long-standing Nordic collaboration in mathematics. Dar es Salaam contributes to modelling, industrial mathematics, regional schools and Math4SDG.
  portrait: The University of Dar es Salaam was a founding member of EAUMP in 2002 and has a long history of collaboration with Nordic universities. This includes mathematical modelling programmes with the University of Oslo, applied mathematics and industrial mathematics activities with LUT University, and ongoing Sida-supported research collaboration with Swedish universities. Dar es Salaam has also hosted regional schools and participated in international research groups. Current activities include Math4SDG and postgraduate mobility with Bergen.
- name: University of Groningen
  country: Netherlands
  image: https://cdn.discovergroningen.com/2018/04/DSC_6360.jpg
  image_alt: University of Groningen
  url: https://www.rug.nl/about-ug/?lang=en
  introduction: The University of Groningen contributes through research collaboration and postgraduate mobility, particularly with Makerere University. Erasmus+ exchanges and doctoral research visits support links between research groups.
  portrait: The University of Groningen contributes to CoRE-Math through research collaboration and postgraduate mobility, particularly with Makerere University. Erasmus+ exchanges and doctoral research visits have strengthened connections between research groups and supported collaborative research. Groningen researchers also participate in international schools and other educational activities within the network.
- name: University of KwaZulu-Natal
  country: South Africa
  image: https://iol-prod.appspot.com/image/8344d52158e3c92fb55ebfeb9411175f81f8a44c/1000/jpeg
  image_alt: University of KwaZulu-Natal
  url: https://www.ukzn.ac.za/
  introduction: The University of KwaZulu-Natal joined CoRE-Math in 2025. It supports fellowships for early-career researchers and helps develop research and postgraduate partnerships across the network.
  portrait: The University of KwaZulu-Natal joined CoRE-Math in 2025, strengthening the Cluster's connections with South African mathematical research environments. The university supports fellowships for early-career researchers from other African member universities, creating opportunities for research visits and collaboration. It also contributes to the development of research and postgraduate partnerships across the network.
- name: University of Nairobi
  country: Kenya
  image: https://humanresource.uonbi.ac.ke/sites/humanresource.uonbi.ac.ke/files/styles/large/public/2019-10/UoN_Main_Campus_aerial_View.jpg?itok=HXIZVKxG
  image_alt: University of Nairobi
  url: https://www.uonbi.ac.ke/
  introduction: A founding member of EAUMP with a long history of regional collaboration in mathematics. Nairobi has hosted algebraic geometry workshops and participated in regional mathematics competitions.
  portrait: The University of Nairobi was a founding member of EAUMP in 2002 and has a long history of regional collaboration in mathematics, including postgraduate education, schools and research activities. It has also hosted the Nairobi workshops in algebraic geometry, bringing together researchers from Africa and Europe. The university has participated in regional mathematics competitions, including the East African Mathematics Olympiad, connecting university mathematics with outreach to younger students.
- name: University of Oslo
  country: Norway
  image: https://premium.vgc.no/v2/images/a05952d7-f1d1-4e75-b6df-809db1a60298?fit=crop&format=auto&h=1365&s=070086803aabf3b253aa3e1a75cbe7620278b80d&w=2048
  image_alt: University of Oslo
  url: https://www.uio.no/english/
  introduction: A longstanding partner in mathematical modelling education in Southern and Eastern Africa, including regional master's programmes in Zimbabwe and Tanzania.
  portrait: The University of Oslo has a long history of mathematics collaboration in Southern and Eastern Africa. It helped develop the Southern African Master's Programme in Mathematical Modelling, hosted by the University of Zimbabwe from 1996 to 2007, and subsequently supported a regional master's programme at the University of Dar es Salaam from 2008 to 2014. These programmes made substantial contributions to postgraduate education in mathematical modelling and established lasting connections with African universities.
- name: University of Rwanda
  country: Rwanda
  image: https://ur.ac.rw/IMG/jpg/hqs_ur_new_dev_t.jpg
  image_alt: University of Rwanda
  url: https://ur.ac.rw/
  introduction: The University of Rwanda has been part of regional mathematics collaboration since 2007. Its partnerships support postgraduate education, applied mathematics, industrial mathematics and mathematics competitions.
  portrait: The University of Rwanda's involvement in regional mathematics collaboration dates back to the participation of the Kigali Institute of Science and Technology in EAUMP from 2007. Mathematics has also been part of Sida-supported research cooperation with Linköping University since 2007, later involving Stockholm University. These programmes have contributed to MSc and PhD education, research and institutional development. More recent activities include collaboration with LUT in applied mathematics, the SPIRIT research project, industrial mathematics and mathematics competitions.
- name: University of Vienna
  country: Austria
  image: /assets/images/members/university-of-vienna-main-building.jpg
  image_alt: University of Vienna Main Building
  url: https://www.univie.ac.at/en/
  introduction: The University of Vienna contributes research collaboration in algebra and algebraic geometry. It has also helped prepare and organise international mathematics schools over many years.
  portrait: The University of Vienna contributes to CoRE-Math through research collaboration in algebra and algebraic geometry, including longstanding connections with researchers in East Africa. Vienna researchers have participated in the Nairobi workshops in algebraic geometry and other international research activities. The university has also played an important role in the preparation and organisation of international mathematics schools over many years, contributing to postgraduate education and the development of research networks across Africa and Europe.
- name: University of Zambia
  country: Zambia
  image: /assets/images/news/560c14_52e533c218eb46da90083aefb203f782~mv2.jpg.avif
  image_alt: University of Zambia MSc graduates
  url: https://www.unza.zm/
  introduction: The University of Zambia joined EAUMP in 2008, extending regional mathematics collaboration beyond East Africa. It contributes to postgraduate education, research collaboration and regional schools.
  portrait: The University of Zambia joined EAUMP in 2008, extending the regional collaboration beyond East Africa. Through EAUMP and ISP support, it has participated in postgraduate education, research collaboration and regional schools. Within CoRE-Math, Zambia continues to contribute to research and postgraduate education. A CoRE-Math school is planned in Lusaka in 2027, alongside opportunities for collaboration through the developing Zambia–Sweden bilateral programme in renewable energy.
- name: Uppsala University
  country: Sweden
  image: /assets/images/members/uppsala-university-angstrom-laboratory.jpeg
  image_alt: Ångström Laboratory, Uppsala University
  url: https://www.uu.se/en/
  introduction: European co-lead of CoRE-Math through the International Science Programme. Uppsala supports long-term mathematics capacity building, research fellowships and the coordination of the Cluster.
  portrait: Uppsala University is a European co-lead of CoRE-Math through the International Science Programme (ISP), which has supported the development of research environments and postgraduate education in low- and lower-middle-income countries since 1961. ISP's long-term capacity-building approach has included support to mathematics departments, research groups, postgraduate training and regional collaboration in Africa. It contributed to the establishment and development of EAUMP from 2002, supported mathematics at Addis Ababa University from 2005, and coordinated the Swedish mathematics contribution to Sida-supported bilateral research programmes in Rwanda, Uganda and Tanzania. These collaborations provide an important foundation for CoRE-Math. Uppsala also supports research fellowships and contributes to the coordination and development of the Cluster.
