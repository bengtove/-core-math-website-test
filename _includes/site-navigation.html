<nav class="site-navigation" aria-label="Main navigation">
  <ul>
    {% for item in site.data.navigation %}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url or page.url contains item.url and item.url != "/" %} class="is-current"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
