---
layout: default
---

<article class="event-page">
  <h1>{{ page.title }}</h1>
  <p><strong>
    {% if page.end_date %}
      {{ page.start_date | date: "%-d %B %Y" }}–{{ page.end_date | date: "%-d %B %Y" }}
    {% else %}
      {{ page.start_date | date: "%-d %B %Y" }}
    {% endif %}
    {% if page.location %} · {{ page.location }}{% endif %}
  </strong></p>

  {{ content }}
</article>
