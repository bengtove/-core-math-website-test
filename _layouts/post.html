---
layout: default
---

<article class="news-post editorial-photos">
  <p class="parent-context"><a href="{{ '/news-events/' | relative_url }}"><span aria-hidden="true">←</span> News &amp; Events</a></p>
  <h1>{{ page.title }}</h1>
  <p><strong>{{ page.date | date: "%-d %B %Y" }}{% if page.location %} · {{ page.location }}{% endif %}</strong></p>

  {{ content }}
</article>

<script src="{{ "/assets/js/news-lightbox.js" | relative_url }}"></script>
