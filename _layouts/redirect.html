<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    {% include freqo-analytics.html %}
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <title>Redirecting…</title>
  </head>
  <body>
    <p><a href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label | default: "Continue to the event page" }}</a>.</p>
    <script>window.location.replace({{ page.redirect_to | relative_url | jsonify }});</script>
  </body>
</html>
